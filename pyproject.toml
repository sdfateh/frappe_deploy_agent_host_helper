[project]
name = "frappe-host-helper"
version = "0.2.1"
description = "Root-owned typed host helper for Frappe Deploy Agent"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Frappe Deploy Agent maintainers"}]
dependencies = ["pydantic==2.13.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["host_helper"]
package-dir = {host_helper = "."}
